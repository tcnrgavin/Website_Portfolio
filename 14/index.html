<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反重力懸浮宇宙餐廳 | Antigravity Diner</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
          colors: { neonGreen: '#00ffcc', neonBlue: '#00bfff', cosmicDark: '#030712' }
        }
      }
    }
  </script>

  <style>
    @keyframes float-antigravity {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.5deg); }
    }
    /* 僅顧客模式使用懸浮動畫 */
    .float-card { animation: float-antigravity 6s ease-in-out infinite; }
    .float-card:nth-child(even) { animation-delay: -3s; }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .neon-card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .neon-card-hover:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.3), 0 0 10px rgba(0, 191, 255, 0.2);
      border-color: rgba(0, 255, 204, 0.5);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(3, 7, 18, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(0, 255, 204, 0.2); border-radius: 3px; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden font-sans">

  <!-- 背景星雲 -->
  <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-500/20 rounded-full blur-[140px] pointer-events-none z-0"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-emerald-500/15 rounded-full blur-[160px] pointer-events-none z-0"></div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 py-6 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="glass-panel rounded-2xl p-4 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-xl shadow-[0_0_15px_rgba(0,255,204,0.5)]">
          <i class="fa-solid fa-shuttle-space"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-emerald-300">
            反重力懸浮宇宙餐廳
          </h1>
          <p class="text-xs text-slate-400" id="systemTitleText">Zero-Gravity Cosmic Diner System</p>
        </div>
      </div>

      <button id="adminToggleBtn" onclick="handleAdminToggle()" class="px-4 py-2 rounded-xl border border-cyan-500/30 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 text-sm font-semibold transition-all duration-300 flex items-center gap-2">
        <i class="fa-solid fa-user-gear"></i>
        <span id="adminToggleText">切換為管理員模式</span>
      </button>
    </header>

    <!-- ================= 管理者專屬頁面 (預設隱藏) ================= -->
    <section id="adminView" class="hidden space-y-6 mb-6">
      
      <!-- 1. 目前所有訂單 -->
      <div class="glass-panel rounded-2xl p-6 border-l-4 border-l-cyan-400">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
          <h2 class="text-lg font-bold text-cyan-300 flex items-center gap-2">
            <i class="fa-solid fa-receipt text-cyan-400"></i> 1. 目前所有訂單
          </h2>
          <button onclick="fetchOrders()" class="text-xs text-cyan-400 hover:underline flex items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i> 重新整理訂單
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-900/80 text-cyan-300 border-b border-slate-800">
              <tr>
                <th class="p-3">末三碼 (電話)</th>
                <th class="p-3">姓名</th>
                <th class="p-3">金額</th>
                <th class="p-3">點餐品項細節</th>
                <th class="p-3">時間</th>
              </tr>
            </thead>
            <tbody id="adminOrdersTable" class="divide-y divide-slate-800/50">
              <tr><td colspan="5" class="p-4 text-center text-slate-500">載入中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 2. 產品庫存 -->
      <div class="glass-panel rounded-2xl p-6 border-l-4 border-l-emerald-400">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
          <h2 class="text-lg font-bold text-emerald-300 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-emerald-400"></i> 2. 產品庫存
          </h2>
          <button onclick="fetchMenu()" class="text-xs text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i> 重新整理庫存
          </button>
        </div>

        <div id="adminInventoryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="col-span-full py-8 text-center text-slate-500">庫存資料載入中...</div>
        </div>
      </div>

      <!-- 3. 新增餐點 -->
      <div class="glass-panel rounded-2xl p-6 border-l-4 border-l-purple-400">
        <h2 class="text-lg font-bold text-purple-300 mb-4 pb-2 border-b border-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-purple-400"></i> 3. 新增餐點
        </h2>
        <form id="addMealForm" onsubmit="handleAddMeal(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">餐點名稱</label>
            <input type="text" id="mealName" required placeholder="例如：超新星爆米花" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">分類</label>
            <select id="mealCategory" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
              <option value="主食">主食</option>
              <option value="副食">副食</option>
              <option value="飲料">飲料</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">價格 (星幣 TWD)</label>
            <input type="number" id="mealPrice" required min="1" placeholder="200" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs text-slate-400 mb-1">圖片網址 (URL)</label>
            <input type="url" id="mealImageUrl" required placeholder="https://..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">預設餐點狀態</label>
            <select id="mealStatus" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
              <option value="上架">上架</option>
              <option value="缺貨中">缺貨中</option>
              <option value="下架">下架</option>
            </select>
          </div>
          <div class="md:col-span-2 lg:col-span-3">
            <label class="block text-xs text-slate-400 mb-1">餐點描述</label>
            <input type="text" id="mealDescription" placeholder="描述餐點特色..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
          </div>
          <div class="md:col-span-2 lg:col-span-3 flex justify-end">
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-500 to-cyan-400 text-slate-950 font-bold hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all flex items-center gap-2">
              <i class="fa-solid fa-paper-plane"></i> 寫入資料庫 (ID自動+1)
            </button>
          </div>
        </form>
      </div>

    </section>

    <!-- ================= 顧客專屬頁面 (點餐區 + 購物車) ================= -->
    <main id="customerView" class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1">
      
      <!-- 菜單列表 -->
      <section class="lg:col-span-2 flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-utensils text-emerald-400"></i> 星際美味選單
          </h2>
          <button onclick="fetchMenu()" class="text-xs text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i> 重新載入
          </button>
        </div>

        <div id="customerMenuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="col-span-full py-20 flex flex-col items-center justify-center text-cyan-400">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3"></i>
            <p class="text-sm tracking-wider">正在連線至反重力資料庫...</p>
          </div>
        </div>
      </section>

      <!-- 購物車 -->
      <section class="lg:col-span-1">
        <div class="glass-panel rounded-2xl p-5 sticky top-6 flex flex-col max-h-[calc(100vh-3rem)]">
          <h2 class="text-lg font-bold text-cyan-300 pb-3 border-b border-slate-800 flex items-center justify-between">
            <span><i class="fa-solid fa-cart-shopping text-cyan-400 mr-2"></i>已點餐單</span>
            <span id="cartBadge" class="text-xs px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">0 項</span>
          </h2>

          <div id="cartItems" class="space-y-3 my-4 overflow-y-auto flex-1 pr-1">
            <div class="text-center py-10 text-slate-500 text-sm">
              <i class="fa-solid fa-basket-shopping text-3xl mb-2 block opacity-40"></i>
              尚未選擇任何懸浮美食
            </div>
          </div>

          <div class="pt-3 border-t border-slate-800 space-y-3">
            <div class="flex justify-between items-center text-sm">
              <span class="text-slate-400">總金額小計</span>
              <span id="cartTotalPrice" class="text-xl font-bold text-emerald-400">$ 0</span>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">顧客姓名</label>
              <input type="text" id="customerName" name="customer_name" autocomplete="off" placeholder="例如：柯克艦長" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">手機電話 (必須為 09 開頭共 10 碼)</label>
              <input type="tel" id="customerPhone" name="tel" autocomplete="tel" maxlength="10" placeholder="0912345678" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
            </div>

            <button id="submitOrderBtn" onclick="submitOrder()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-400 text-slate-950 font-bold hover:shadow-[0_0_20px_rgba(0,255,204,0.4)] transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-rocket"></i> 確認送出點餐
            </button>
          </div>
        </div>
      </section>

    </main>

    <footer class="mt-8 py-4 text-center text-xs text-slate-600 border-t border-slate-900">
      &copy; 2026 Antigravity Cosmic Diner System. All rights reserved.
    </footer>
  </div>

  <!-- 管理員登入 Modal -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden">
    <div class="glass-panel p-6 rounded-2xl max-w-sm w-full mx-4 border border-cyan-500/30">
      <h3 class="text-lg font-bold text-cyan-300 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-lock"></i> 管理員身份驗證
      </h3>
      <div class="space-y-3 mb-5">
        <div>
          <label class="block text-xs text-slate-400 mb-1">管理員帳號</label>
          <input type="text" id="adminUser" name="admin_username" autocomplete="username" placeholder="預設: admin" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">密碼</label>
          <input type="password" id="adminPass" name="admin_password" autocomplete="current-password" placeholder="預設: 123456" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-400">
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="closeLoginModal()" class="w-1/2 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold text-sm">取消</button>
        <button onclick="submitAdminLogin()" class="w-1/2 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-sm">驗證登入</button>
      </div>
    </div>
  </div>

  <!-- 提示 Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="glass-panel p-6 rounded-2xl max-w-sm w-full mx-4 text-center border border-cyan-500/30">
      <div id="modalIcon" class="text-4xl mb-3 text-cyan-400"><i class="fa-solid fa-circle-check"></i></div>
      <h3 id="modalTitle" class="text-lg font-bold text-slate-100 mb-2">提示訊息</h3>
      <p id="modalMessage" class="text-xs text-slate-300 mb-5 whitespace-pre-line">內容敘述...</p>
      <button onclick="closeModal()" class="w-full py-2 bg-cyan-500/20 border border-cyan-500/40 hover:bg-cyan-500/30 text-cyan-300 rounded-xl font-semibold text-sm">確認</button>
    </div>
  </div>

  <!-- Loading 指示器 -->
  <div id="globalLoading" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden">
    <div class="w-16 h-16 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
    <p id="loadingText" class="mt-4 text-sm tracking-widest text-cyan-300 animate-pulse">連線至宇宙網路中...</p>
  </div>

  <script>
    // 請將下方網址替換為您的 Google Apps Script Web App 部署網址
    const API_URL = 'https://script.google.com/macros/s/AKfycbzW0UpfQ6eArjCfZpO12yH4SPdX8MJK3MuAQaskFOMhOZJfoSH4480YZC-SHLP3sF_V/exec';

    let menuData = [];
    let cart = [];
    let isAdminMode = false;
    const FALLBACK_IMAGE_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" fill="%230f172a"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2300ffcc" font-size="20">🛸 宇宙美食影像</text></svg>`;

    document.addEventListener('DOMContentLoaded', fetchMenu);

    // 1. 切換管理員模式與驗證
    function handleAdminToggle() {
      if (isAdminMode) {
        isAdminMode = false;
        document.getElementById('adminView').classList.add('hidden');
        document.getElementById('customerView').classList.remove('hidden');
        document.getElementById('adminToggleText').textContent = '切換為管理員模式';
        document.getElementById('systemTitleText').textContent = 'Zero-Gravity Cosmic Diner System';
        fetchMenu();
      } else {
        document.getElementById('loginModal').classList.remove('hidden');
      }
    }

    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

    async function submitAdminLogin() {
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value.trim();

      if (!user || !pass) return alert('請輸入帳號與密碼！');
      if (!checkApiUrl()) return;

      showLoading('驗證管理員身份...');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        const result = await response.json();

        if (result.status === 'success') {
          isAdminMode = true;
          closeLoginModal();
          
          // 隱藏顧客視圖，顯示管理者專屬頁面
          document.getElementById('customerView').classList.add('hidden');
          document.getElementById('adminView').classList.remove('hidden');
          
          document.getElementById('adminToggleText').textContent = '退出管理員模式';
          document.getElementById('systemTitleText').textContent = '管理員後台控制中心 (Admin Dashboard)';
          
          showModal('登入成功', '歡迎回到管理員後台系統！');
          
          // 自動載入 1.訂單 與 2.庫存
          fetchOrders();
          fetchMenu();
        } else {
          showModal('驗證失敗', result.message, 'error');
        }
      } catch (err) {
        showModal('錯誤', '登入過程發生問題', 'error');
      } finally {
        hideLoading();
      }
    }

    // 2. 讀取訂單清單
    async function fetchOrders() {
      if (!checkApiUrl() || !isAdminMode) return;
      const tbody = document.getElementById('adminOrdersTable');
      tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-cyan-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>讀取最新訂單中...</td></tr>`;

      try {
        const response = await fetch(`${API_URL}?action=readOrders`);
        const result = await response.json();

        if (result.status === 'success') {
          const orders = result.data;
          if (!orders || orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">目前尚無任何訂單紀錄</td></tr>`;
            return;
          }

          tbody.innerHTML = orders.map(ord => {
            const itemsSummary = Array.isArray(ord.items) 
              ? ord.items.map(i => `${i.name} x${i.quantity}`).join(', ') 
              : (ord.items || '無細節');

            return `
              <tr class="hover:bg-slate-900/40">
                <td class="p-3 font-bold text-cyan-300">${ord.phoneLast3 || (ord.phone ? ord.phone.slice(-3) : '無')}</td>
                <td class="p-3 font-medium text-slate-200">${ord.customerName || '未名'}</td>
                <td class="p-3 font-bold text-emerald-400">$ ${ord.totalPrice || 0}</td>
                <td class="p-3 text-xs text-slate-300 max-w-xs truncate" title="${itemsSummary}">${itemsSummary}</td>
                <td class="p-3 text-xs text-slate-500">${ord.timestamp || '未知時間'}</td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-400">無法讀取訂單：${result.message || '後端未處理 readOrders'}</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-400">連線異常，請確認 GAS 是否有新增 readOrders 功能。</td></tr>`;
      }
    }

    // 3. 讀取餐點選單 / 庫存
    async function fetchMenu() {
      if (!checkApiUrl()) return;
      showLoading('讀取資料中...');

      try {
        const url = isAdminMode ? `${API_URL}?action=read&all=true` : `${API_URL}?action=read`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === 'success') {
          menuData = result.data;
          if (isAdminMode) {
            renderAdminInventory();
          } else {
            renderCustomerMenu();
          }
        } else {
          showModal('讀取失敗', result.message, 'error');
        }
      } catch (error) {
        showModal('連線錯誤', '無法取得餐點資料。', 'error');
      } finally {
        hideLoading();
      }
    }

    // 4. 渲染管理者「產品庫存」
    function renderAdminInventory() {
      const grid = document.getElementById('adminInventoryGrid');
      if (!menuData || menuData.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-8 text-center text-slate-500">目前庫存中尚無餐點</div>`;
        return;
      }

      grid.innerHTML = menuData.map(item => {
        return `
          <div class="glass-panel p-4 rounded-xl border border-slate-800 flex flex-col justify-between space-y-3 bg-slate-900/50">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">ID: ${item.id}</span>
                  <span class="text-xs text-cyan-400 font-semibold">[${item.category}]</span>
                </div>
                <h3 class="font-bold text-slate-100 text-base mt-1">${item.name}</h3>
              </div>
              <div class="text-emerald-400 font-bold text-base">$ ${item.price}</div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-800/80">
              <div class="flex items-center gap-1.5 flex-1">
                <span class="text-xs text-slate-400 whitespace-nowrap">狀態:</span>
                <select onchange="changeMealStatus(${item.id}, this.value)" class="w-full bg-slate-950 text-xs border border-slate-700 rounded-lg px-2 py-1.5 text-cyan-300 focus:outline-none focus:border-cyan-400">
                  <option value="上架" ${item.status === '上架' ? 'selected' : ''}>🟢 上架</option>
                  <option value="缺貨中" ${item.status === '缺貨中' ? 'selected' : ''}>🟡 缺貨中</option>
                  <option value="下架" ${item.status === '下架' ? 'selected' : ''}>🔴 下架</option>
                </select>
              </div>

              <button onclick="deleteMeal('${item.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 text-xs flex items-center gap-1 transition-all" title="刪除品項">
                <i class="fa-solid fa-trash-can"></i> 刪除
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 5. 渲染顧客模式「星際美味選單」
    function renderCustomerMenu() {
      const grid = document.getElementById('customerMenuGrid');
      if (!menuData || menuData.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500">目前尚無餐點</div>`;
        return;
      }

      grid.innerHTML = menuData.map(item => {
        const isOutOfStock = item.status === '缺貨中';
        
        return `
          <div class="float-card glass-panel rounded-2xl overflow-hidden neon-card-hover flex flex-col justify-between relative group ${isOutOfStock ? 'opacity-70' : ''}">
            <div>
              <div class="h-44 w-full overflow-hidden bg-slate-900 relative">
                <img src="${item.imageUrl}" onerror="this.onerror=null; this.src='${FALLBACK_IMAGE_SVG}';" class="w-full h-full object-cover">
                
                ${isOutOfStock ? `
                  <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center">
                    <span class="text-rose-400 font-bold border border-rose-500/40 px-3 py-1 rounded-full text-xs bg-rose-500/10">
                      <i class="fa-solid fa-ban mr-1"></i>缺貨中
                    </span>
                  </div>
                ` : ''}

                <span class="absolute bottom-2 left-2 text-[10px] px-2 py-0.5 rounded-full border bg-slate-800/80 text-slate-300 backdrop-blur-md">
                  ID: ${item.id} | ${item.category}
                </span>
              </div>

              <div class="p-4">
                <div class="flex justify-between items-start mb-1">
                  <h3 class="font-bold text-slate-100 text-base">${item.name}</h3>
                  <span class="text-emerald-400 font-bold text-base">$ ${item.price}</span>
                </div>
                <p class="text-xs text-slate-400 line-clamp-2 mt-1 leading-relaxed">${item.description || '無描述'}</p>
              </div>
            </div>

            <div class="p-4 pt-0">
              <button onclick="addToCart(${item.id})" ${isOutOfStock ? 'disabled' : ''} class="w-full py-2 rounded-xl border ${isOutOfStock ? 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-800/80 border-slate-700 hover:border-cyan-500/50 hover:bg-cyan-500/10 hover:text-cyan-300 text-slate-300'} text-xs font-semibold transition-all flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-plus text-[10px]"></i> ${isOutOfStock ? '暫停供應' : '加入點餐單'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 變更餐點狀態
    async function changeMealStatus(mealId, newStatus) {
      if (!checkApiUrl()) return;
      showLoading('更新餐點狀態中...');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'updateStatus', id: mealId, status: newStatus })
        });
        const result = await response.json();

        if (result.status === 'success') {
          showModal('更新成功', `餐點狀態已更新為「${newStatus}」`);
          fetchMenu();
        } else {
          showModal('更新失敗', result.message, 'error');
        }
      } catch (err) {
        showModal('錯誤', '更新狀態失敗', 'error');
      } finally {
        hideLoading();
      }
    }

    // 新增餐點
    async function handleAddMeal(event) {
      event.preventDefault();
      if (!checkApiUrl()) return;

      const payload = {
        action: 'add',
        name: document.getElementById('mealName').value.trim(),
        category: document.getElementById('mealCategory').value,
        price: Number(document.getElementById('mealPrice').value),
        imageUrl: document.getElementById('mealImageUrl').value.trim(),
        status: document.getElementById('mealStatus').value,
        description: document.getElementById('mealDescription').value.trim()
      };

      showLoading('新增餐點中...');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === 'success') {
          showModal('成功', `餐點新增成功，自動配置 ID 為: ${result.data.id}`);
          document.getElementById('addMealForm').reset();
          fetchMenu();
        } else {
          showModal('新增失敗', result.message, 'error');
        }
      } catch (error) {
        showModal('系統錯誤', '新增失敗', 'error');
      } finally {
        hideLoading();
      }
    }

    // 刪除餐點
    async function deleteMeal(id) {
      if (!confirm(`確定要刪除 ID: ${id} 的餐點嗎？`)) return;
      showLoading('刪除中...');
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'delete', id: id })
        });
        const result = await response.json();
        if (result.status === 'success') {
          showModal('成功', '餐點已移除！');
          fetchMenu();
        } else {
          showModal('刪除失敗', result.message, 'error');
        }
      } catch (err) {
        showModal('錯誤', '刪除請求失敗', 'error');
      } finally { hideLoading(); }
    }

    // 顧客下單 (含 09 開頭 10 碼電話驗證)
    async function submitOrder() {
      if (!checkApiUrl()) return;

      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const phoneRegex = /^09\d{8}$/;

      if (!name) return showModal('提示', '請填寫顧客姓名！', 'warning');
      if (!phoneRegex.test(phone)) return showModal('格式錯誤', '手機電話必須為 09 開頭共 10 位數字！', 'warning');
      if (cart.length === 0) return showModal('提示', '購物車是空的！', 'warning');

      const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);

      const payload = {
        action: 'order',
        customerName: name,
        phone: phone,
        items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity })),
        totalPrice: totalPrice
      };

      showLoading('傳送訂單中...');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === 'success') {
          showModal('下單成功！', `訂單號: ${result.data.orderId}\n取餐末三碼為：${phone.slice(-3)}`);
          cart = [];
          document.getElementById('customerName').value = '';
          document.getElementById('customerPhone').value = '';
          updateCartUI();
        } else {
          showModal('下單失敗', result.message, 'error');
        }
      } catch (err) {
        showModal('錯誤', '下單過程發生異常', 'error');
      } finally {
        hideLoading();
      }
    }

    // 購物車輔助邏輯
    function addToCart(mealId) {
      const meal = menuData.find(m => String(m.id) === String(mealId));
      if (!meal || meal.status === '缺貨中') return;

      const existing = cart.find(item => String(item.id) === String(mealId));
      if (existing) { existing.quantity += 1; } 
      else { cart.push({ id: meal.id, name: meal.name, price: Number(meal.price), quantity: 1 }); }
      updateCartUI();
    }

    function changeQuantity(mealId, delta) {
      const item = cart.find(i => String(i.id) === String(mealId));
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) cart = cart.filter(i => String(i.id) !== String(mealId));
      updateCartUI();
    }

    function updateCartUI() {
      const cartContainer = document.getElementById('cartItems');
      const cartBadge = document.getElementById('cartBadge');
      const totalPriceEl = document.getElementById('cartTotalPrice');

      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartBadge.textContent = `${totalCount} 項`;
      totalPriceEl.textContent = `$ ${totalPrice}`;

      if (cart.length === 0) {
        cartContainer.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm"><i class="fa-solid fa-basket-shopping text-3xl mb-2 block opacity-40"></i>購物車為空</div>`;
        return;
      }

      cartContainer.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-slate-800 text-xs">
          <div class="flex-1 pr-2">
            <div class="font-semibold text-slate-200">${item.name}</div>
            <div class="text-slate-400 mt-0.5">$ ${item.price}</div>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="changeQuantity(${item.id}, -1)" class="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center"><i class="fa-solid fa-minus text-[10px]"></i></button>
            <span class="font-bold text-cyan-300 w-4 text-center">${item.quantity}</span>
            <button onclick="changeQuantity(${item.id}, 1)" class="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center"><i class="fa-solid fa-plus text-[10px]"></i></button>
          </div>
        </div>
      `).join('');
    }

    function checkApiUrl() {
      if (!API_URL || API_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_API_URL') {
        showModal('系統提示', '請先將程式碼中的 API_URL 替換為您的 Google Apps Script 部署網址！', 'warning');
        return false;
      }
      return true;
    }

    // Modal 與 Loading 控制函數
    function showModal(title, message, type = 'success') {
      const modal = document.getElementById('modalOverlay');
      const icon = document.getElementById('modalIcon');
      const titleEl = document.getElementById('modalTitle');
      const msgEl = document.getElementById('modalMessage');

      titleEl.textContent = title;
      msgEl.textContent = message;

      if (type === 'error') {
        icon.className = 'text-4xl mb-3 text-rose-400';
        icon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
      } else if (type === 'warning') {
        icon.className = 'text-4xl mb-3 text-amber-400';
        icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
      } else {
        icon.className = 'text-4xl mb-3 text-cyan-400';
        icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
      }

      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeModal() {
      const modal = document.getElementById('modalOverlay');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function showLoading(text = '處理中...') {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('globalLoading').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('globalLoading').classList.add('hidden');
    }
  </script>
</body>
</html>
