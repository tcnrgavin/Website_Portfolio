<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>運動預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(16, 185, 129, 0.16), transparent 24%),
          radial-gradient(circle at top right, rgba(6, 182, 212, 0.18), transparent 28%),
          linear-gradient(135deg, #020617 0%, #0f172a 45%, #020617 100%);
        color: #e2e8f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(255,255,255,0.22) 1px, transparent 1px),
          radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px);
        background-size: 160px 160px, 240px 240px;
        background-position: 0 0, 80px 80px;
        opacity: 0.12;
        pointer-events: none;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 45px rgba(0, 0, 0, 0.35);
      }

      .neon-input,
      .neon-btn,
      .neon-select,
      .neon-textarea {
        transition: all 0.25s ease;
      }

      .neon-input:focus,
      .neon-select:focus,
      .neon-textarea:focus,
      .neon-btn:hover,
      .neon-btn:focus-visible {
        box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 18px rgba(34, 211, 238, 0.36), 0 0 36px rgba(16, 185, 129, 0.3);
        border-color: rgba(100, 255, 214, 0.4);
        transform: translateY(-1px);
      }

      .neon-btn {
        position: relative;
        overflow: hidden;
      }

      .neon-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
        transform: translateX(-100%);
        transition: transform 0.55s ease;
      }

      .neon-btn:hover::after {
        transform: translateX(100%);
      }

      .card-float {
        animation: float 6.4s ease-in-out infinite;
      }

      .table-float {
        animation: float 7.2s ease-in-out infinite reverse;
      }

      .badge-glow {
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.28);
      }

      .spinner {
        width: 42px;
        height: 42px;
        border-radius: 9999px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #34d399;
        border-right-color: #22d3ee;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 24px rgba(52, 211, 153, 0.35);
      }

      .loader-line {
        position: relative;
        overflow: hidden;
      }

      .loader-line::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.24), transparent);
        animation: shimmer 1.2s linear infinite;
      }

      .toast {
        opacity: 0;
        transform: translateY(16px);
        pointer-events: none;
        transition: all 0.3s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes shimmer {
        to {
          transform: translateX(100%);
        }
      }
    </style>
  </head>
  <body class="relative overflow-x-hidden">
    <div class="absolute inset-0 pointer-events-none opacity-80">
      <div class="absolute left-[-8%] top-[-10%] h-72 w-72 rounded-full bg-emerald-400/20 blur-3xl"></div>
      <div class="absolute right-[-6%] top-8 h-80 w-80 rounded-full bg-cyan-400/20 blur-3xl"></div>
    </div>

    <main class="relative z-10 mx-auto flex max-w-7xl flex-col gap-6 px-4 py-8 sm:px-6 lg:px-8">
      <header class="glass-card card-float rounded-[28px] border border-white/10 p-6 sm:p-8">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p class="mb-3 inline-flex items-center rounded-full border border-cyan-400/25 bg-cyan-400/10 px-3 py-1 text-sm font-medium text-cyan-200">
              Antigravity • Motion Booking
            </p>
            <h1 class="text-3xl font-semibold tracking-[0.2em] text-slate-50 sm:text-4xl">
              運動預約系統
            </h1>
            <p class="mt-3 max-w-2xl text-sm leading-7 text-slate-300 sm:text-base">
              在宇宙般的霓虹氛圍中，快速建立預約，並即時同步到 Google Apps Script 的 orders 資料表。
            </p>
          </div>
          <div class="rounded-2xl border border-emerald-400/20 bg-emerald-400/10 px-4 py-3 text-sm text-emerald-100">
            <div class="font-semibold">API 端點</div>
            <div class="mt-1 break-all text-[11px] text-emerald-200/90">${API_URL}</div>
          </div>
        </div>
      </header>

      <section class="grid gap-6 lg:grid-cols-[1.05fr_0.95fr]">
        <div class="glass-card card-float rounded-[28px] border border-white/10 p-5 sm:p-6">
          <div class="mb-5 flex items-center justify-between">
            <div>
              <h2 class="text-xl font-semibold text-slate-50">新增預約</h2>
              <p class="mt-1 text-sm text-slate-400">提交後將自動刷新右側預約列表。</p>
            </div>
            <div class="rounded-full border border-white/10 bg-white/10 px-3 py-1 text-xs font-medium uppercase tracking-[0.25em] text-slate-200">
              POST
            </div>
          </div>

          <form id="coachForm" class="space-y-4">
            <div class="grid gap-4 sm:grid-cols-2">
              <label class="block">
                <span class="mb-2 block text-sm text-slate-300">使用者名字</span>
                <input
                  class="neon-input neon-textarea w-full rounded-2xl border border-white/10 bg-slate-900/70 px-4 py-3 text-sm text-slate-100 outline-none"
                  name="userName"
                  placeholder="例如：Alice Wang"
                  required
                />
              </label>
              <label class="block">
                <span class="mb-2 block text-sm text-slate-300">教練名字</span>
                <input
                  class="neon-input neon-textarea w-full rounded-2xl border border-white/10 bg-slate-900/70 px-4 py-3 text-sm text-slate-100 outline-none"
                  name="coachName"
                  placeholder="例如：Mina Chen"
                  required
                />
              </label>
            </div>

            <label class="block">
              <span class="mb-2 block text-sm text-slate-300">備註</span>
              <textarea
                class="neon-input neon-textarea min-h-[108px] w-full rounded-2xl border border-white/10 bg-slate-900/70 px-4 py-3 text-sm text-slate-100 outline-none"
                name="note"
                placeholder="輸入預約時間、需求或其他說明"
              ></textarea>
            </label>

            <button
              id="submitBtn"
              type="submit"
              class="neon-btn inline-flex w-full items-center justify-center rounded-2xl border border-emerald-400/30 bg-gradient-to-r from-emerald-500/20 via-cyan-400/20 to-emerald-500/20 px-4 py-3 text-sm font-semibold text-emerald-100 shadow-[0_0_24px_rgba(16,185,129,0.16)]"
            >
              <span id="submitBtnText">建立預約</span>
            </button>
          </form>
        </div>

        <div class="space-y-6">
          <div class="glass-card table-float rounded-[28px] border border-white/10 p-5 sm:p-6">
            <div class="mb-4 flex items-center justify-between gap-3">
              <div>
                <h2 class="text-xl font-semibold text-slate-50">預約清單</h2>
                <p class="mt-1 text-sm text-slate-400">顯示目前提交的預約資料。</p>
              </div>
              <div class="rounded-full border border-cyan-400/20 bg-cyan-400/10 px-3 py-1 text-xs font-medium uppercase tracking-[0.25em] text-cyan-100">
                ORDERS
              </div>
            </div>

            <div id="ordersLoading" class="loader-line rounded-2xl border border-white/10 bg-slate-900/40 p-6">
              <div class="flex items-center justify-center gap-3 text-slate-300">
                <div class="spinner"></div>
                <span class="text-sm tracking-[0.2em] text-slate-200">正在同步預約資料…</span>
              </div>
            </div>

            <div id="ordersWrap" class="hidden overflow-x-auto">
              <table class="min-w-full border-separate border-spacing-y-2 text-left text-sm text-slate-200">
                <thead>
                  <tr class="text-slate-400">
                    <th class="px-3 py-2 font-medium">使用者</th>
                    <th class="px-3 py-2 font-medium">教練</th>
                    <th class="px-3 py-2 font-medium">預約時間</th>
                    <th class="px-3 py-2 font-medium">備註</th>
                    <th class="px-3 py-2 font-medium">狀態</th>
                  </tr>
                </thead>
                <tbody id="ordersTableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="glass-card rounded-[28px] border border-white/10 p-5 sm:p-6">
            <div class="mb-4 flex items-center justify-between gap-3">
              <div>
                <h2 class="text-xl font-semibold text-slate-50">教練資料</h2>
                <p class="mt-1 text-sm text-slate-400">讀取 coaches 資料並顯示教練列表。</p>
              </div>
              <div class="rounded-full border border-emerald-400/20 bg-emerald-400/10 px-3 py-1 text-xs font-medium uppercase tracking-[0.25em] text-emerald-100">
                COACHES
              </div>
            </div>

            <div id="coachesLoading" class="loader-line rounded-2xl border border-white/10 bg-slate-900/40 p-6">
              <div class="flex items-center justify-center gap-3 text-slate-300">
                <div class="spinner"></div>
                <span class="text-sm tracking-[0.2em] text-slate-200">正在同步教練資料…</span>
              </div>
            </div>

            <div id="coachesWrap" class="hidden overflow-x-auto">
              <table class="min-w-full border-separate border-spacing-y-2 text-left text-sm text-slate-200">
                <thead>
                  <tr class="text-slate-400">
                    <th class="px-3 py-2 font-medium">教練姓名</th>
                    <th class="px-3 py-2 font-medium">專長</th>
                    <th class="px-3 py-2 font-medium">資歷</th>
                    <th class="px-3 py-2 font-medium">聯絡</th>
                  </tr>
                </thead>
                <tbody id="coachesTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast fixed bottom-6 right-6 z-50 rounded-2xl border border-emerald-400/30 bg-slate-900/85 px-4 py-3 text-sm text-emerald-100 shadow-[0_0_28px_rgba(16,185,129,0.2)]">
      資料已成功同步。
    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbysyFYV0ow9ZDRb7IFPguV57juaExM0XSY31Emc3Xm2Aka5ZTNfL39qUqCWTa-GuCaj/exec";

      const form = document.getElementById("coachForm");
      const submitBtn = document.getElementById("submitBtn");
      const submitBtnText = document.getElementById("submitBtnText");
      const ordersLoading = document.getElementById("ordersLoading");
      const ordersWrap = document.getElementById("ordersWrap");
      const ordersTableBody = document.getElementById("ordersTableBody");
      const coachesLoading = document.getElementById("coachesLoading");
      const coachesWrap = document.getElementById("coachesWrap");
      const coachesTableBody = document.getElementById("coachesTableBody");
      const toast = document.getElementById("toast");

      const fallbackOrders = [
        {
          userName: "Sample User A",
          coachName: "Mina Chen",
          createdAt: "2026-07-28 09:00",
          note: "暫時替代資料，等 Google Sheet 有資料後會自動更新",
          status: "已預約"
        },
        {
          userName: "Sample User B",
          coachName: "Leo Wang",
          createdAt: "2026-07-28 14:30",
          note: "示範資料",
          status: "待確認"
        }
      ];

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove("show"), 2600);
      }

      function setLoadingState(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtnText.textContent = isLoading ? "正在建立預約..." : "建立預約";
        submitBtn.classList.toggle("opacity-70", isLoading);
      }

      function normalizeOrders(raw) {
        if (!raw || typeof raw !== "string") return [];

        const trimmed = raw.trim();
        if (!trimmed) return [];

        try {
          const parsed = JSON.parse(trimmed);
          if (Array.isArray(parsed)) return parsed;
          if (parsed && typeof parsed === "object") {
            return parsed.records ?? parsed.data ?? parsed.orders ?? parsed.items ?? [];
          }
        } catch {
          // ignore and fall back below
        }

        return [];
      }

      function renderOrders(data) {
        const records = Array.isArray(data) ? data : data?.records ?? data?.data ?? [];
        ordersTableBody.innerHTML = "";

        if (!records.length) {
          const fallback = fallbackOrders;
          const rows = fallback.map((order, index) => {
            const userName = order.userName || order.user || order.username || "未填寫";
            const coachName = order.coachName || order.coach || order.trainer || "未填寫";
            const createdAt = order.createdAt || order.time || order.date || "—";
            const note = order.note || order.comment || "—";
            const status = order.status || (index % 2 === 0 ? "已預約" : "待確認");
            const badgeClass = [
              "bg-cyan-400/15 text-cyan-100 border-cyan-400/30",
              "bg-emerald-400/15 text-emerald-100 border-emerald-400/30",
              "bg-fuchsia-400/15 text-fuchsia-100 border-fuchsia-400/30",
              "bg-amber-400/15 text-amber-100 border-amber-400/30"
            ][index % 4];

            return `
              <tr class="rounded-2xl bg-slate-900/55">
                <td class="px-3 py-3"><div class="font-medium text-slate-100">${escapeHtml(userName)}</div></td>
                <td class="px-3 py-3 text-slate-300">${escapeHtml(coachName)}</td>
                <td class="px-3 py-3 text-slate-300">${escapeHtml(createdAt)}</td>
                <td class="px-3 py-3 text-slate-300">${escapeHtml(note)}</td>
                <td class="px-3 py-3">
                  <span class="badge-glow inline-flex rounded-full border px-2.5 py-1 text-xs font-medium ${badgeClass}">
                    ${escapeHtml(status)}
                  </span>
                </td>
              </tr>
            `;
          });

          ordersTableBody.innerHTML = rows.join("");
          ordersLoading.classList.add("hidden");
          ordersWrap.classList.remove("hidden");
          return;
        }

        const rows = records.map((order, index) => {
          const userName = order.userName || order.user || order.username || "未填寫";
          const coachName = order.coachName || order.coach || order.trainer || "未填寫";
          const createdAt = order.createdAt || order.time || order.date || "—";
          const note = order.note || order.comment || "—";
          const status = order.status || (index % 2 === 0 ? "已預約" : "待確認");
          const badgeClass = [
            "bg-cyan-400/15 text-cyan-100 border-cyan-400/30",
            "bg-emerald-400/15 text-emerald-100 border-emerald-400/30",
            "bg-fuchsia-400/15 text-fuchsia-100 border-fuchsia-400/30",
            "bg-amber-400/15 text-amber-100 border-amber-400/30"
          ][index % 4];

          return `
            <tr class="rounded-2xl bg-slate-900/55">
              <td class="px-3 py-3"><div class="font-medium text-slate-100">${escapeHtml(userName)}</div></td>
              <td class="px-3 py-3 text-slate-300">${escapeHtml(coachName)}</td>
              <td class="px-3 py-3 text-slate-300">${escapeHtml(createdAt)}</td>
              <td class="px-3 py-3 text-slate-300">${escapeHtml(note)}</td>
              <td class="px-3 py-3">
                <span class="badge-glow inline-flex rounded-full border px-2.5 py-1 text-xs font-medium ${badgeClass}">
                  ${escapeHtml(status)}
                </span>
              </td>
            </tr>
          `;
        });

        ordersTableBody.innerHTML = rows.join("");
        ordersLoading.classList.add("hidden");
        ordersWrap.classList.remove("hidden");
      }

      function renderCoaches(data) {
        const records = Array.isArray(data) ? data : data?.records ?? data?.data ?? [];
        coachesTableBody.innerHTML = "";

        if (!records.length) {
          coachesTableBody.innerHTML = `
            <tr>
              <td colspan="4" class="px-3 py-5 text-center text-slate-400">暫時沒有 coaches 資料。</td>
            </tr>
          `;
          coachesLoading.classList.add("hidden");
          coachesWrap.classList.remove("hidden");
          return;
        }

        const rows = records.map((coach) => {
          const coachName = coach.coachName || coach.name || coach.coach || "未填寫";
          const specialty = coach.specialty || coach.field || "未填寫";
          const experience = coach.experience || coach.experienceYears || "未填寫";
          const contact = coach.contact || coach.email || coach.phone || "未填寫";

          return `
            <tr class="rounded-2xl bg-slate-900/55">
              <td class="px-3 py-3"><div class="font-medium text-slate-100">${escapeHtml(coachName)}</div></td>
              <td class="px-3 py-3 text-slate-300">${escapeHtml(specialty)}</td>
              <td class="px-3 py-3 text-slate-300">${escapeHtml(experience)}</td>
              <td class="px-3 py-3 text-slate-300">${escapeHtml(contact)}</td>
            </tr>
          `;
        });

        coachesTableBody.innerHTML = rows.join("");
        coachesLoading.classList.add("hidden");
        coachesWrap.classList.remove("hidden");
      }

      async function fetchOrders() {
        ordersLoading.classList.remove("hidden");
        ordersWrap.classList.add("hidden");

        try {
          const response = await fetch(`${API_URL}?action=read&sheet=orders`, { method: "GET" });
          if (!response.ok) throw new Error(`讀取失敗：${response.status}`);

          const text = await response.text();
          const payload = normalizeOrders(text);
          renderOrders(payload.length ? payload : fallbackOrders);
        } catch (error) {
          ordersLoading.classList.add("hidden");
          ordersWrap.classList.remove("hidden");
          ordersTableBody.innerHTML = `
            <tr>
              <td colspan="5" class="px-3 py-5 text-center text-rose-300">${escapeHtml(error.message || "資料讀取錯誤")}</td>
            </tr>
          `;
          renderOrders(fallbackOrders);
          showToast("預約資料讀取失敗，已顯示替代資料。" );
        }
      }

      async function fetchCoachesData() {
        coachesLoading.classList.remove("hidden");
        coachesWrap.classList.add("hidden");

        try {
          const response = await fetch(`${API_URL}?action=read&sheet=coaches`, { method: "GET" });
          if (!response.ok) throw new Error(`讀取失敗：${response.status}`);

          const text = await response.text();
          const payload = normalizeOrders(text);
          renderCoaches(payload.length ? payload : []);
        } catch (error) {
          coachesLoading.classList.add("hidden");
          coachesWrap.classList.remove("hidden");
          coachesTableBody.innerHTML = `
            <tr>
              <td colspan="4" class="px-3 py-5 text-center text-rose-300">${escapeHtml(error.message || "資料讀取錯誤")}</td>
            </tr>
          `;
          showToast("教練資料讀取失敗。" );
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const payload = {
          action: "create",
          sheet: "orders",
          userName: formData.get("userName")?.toString().trim(),
          coachName: formData.get("coachName")?.toString().trim(),
          note: formData.get("note")?.toString().trim(),
          createdAt: new Date().toLocaleString("zh-TW"),
          status: "待確認"
        };

        if (!payload.userName || !payload.coachName) {
          showToast("請填寫使用者名字與教練名字。");
          return;
        }

        setLoadingState(true);

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });

          if (!response.ok) throw new Error(`寫入失敗：${response.status}`);

          showToast("預約已成功建立。");
          form.reset();
          await fetchOrders();
        } catch (error) {
          showToast(error.message || "寫入失敗，請稍後再試。" );
        } finally {
          setLoadingState(false);
        }
      });

      fetchOrders();
      fetchCoachesData();
    </script>
  </body>
</html>
